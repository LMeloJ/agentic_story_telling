[project]
name = "dynevi"
version = "0.0.1"
description = "Immersive storytelling experience with AI-powered NPCs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dynevi Team"}
]
keywords = ["ai", "storytelling", "npc", "langgraph", "chromadb", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Dependencies
    "langgraph>=0.2.0",
    "chromadb>=0.4.0",
    "google-generativeai>=0.3.0",
    "langchain>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # Embedding models for ChromaDB
    "sentence-transformers>=2.2.0",
    # GUI Framework (Kivy)
    "kivy>=2.2.0",
    "kivymd>=1.1.1",  # Material Design components (optional but useful)
    # Video Playback
    "opencv-python>=4.8.0",
    # Audio Playback
    "pygame>=2.5.0",
    # Utilities
    "uvicorn>=0.24.0",
    # TTS Libraries - Offline TTS
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
# Cloud TTS providers (optional - install as needed)
cloud-tts = [
    "gTTS>=2.5.0",  # Google TTS (requires internet)
    "elevenlabs>=0.2.0",  # ElevenLabs TTS
    "azure-cognitiveservices-speech>=1.32.0",  # Azure Speech Services
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    # Notebook and visualization dependencies
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    # Notebook and visualization dependencies
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "real_api: marks tests that make real API calls (deselect with '-m \"not real_api\"')",
]

